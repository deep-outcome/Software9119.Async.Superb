name: nupkg-publication

on:
  push:
    branches: [ "prong" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cfg-val-job:
    name: Validation (${{matrix.tfm }}-${{ matrix.configuration }})
    runs-on: windows-latest
    environment: nupkg-pub
    strategy:
      fail-fast: false
      matrix:
       include:
          - tfm: net10.0
            sdk: 10.0.x
            configuration: Debug
          - tfm: net10.0
            sdk: 10.0.x
            configuration: Release
          - tfm: net9.0
            sdk: 9.0.x
            configuration: Debug
          - tfm: net9.0
            sdk: 9.0.x
            configuration: Release
          - tfm: net8.0
            sdk: 8.0.x
            configuration: Debug
          - tfm: net8.0
            sdk: 8.0.x
            configuration: Release

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.sdk }}

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }} -f ${{ matrix.tfm }} --no-restore

    - name: Test
      run: dotnet test --configuration ${{ matrix.configuration }} -f ${{ matrix.tfm }} --no-restore

  nupkg-pub-job:
    runs-on: windows-latest
    environment: nupkg-pub
    needs: cfg-val-job
    if: github.ref == 'refs/heads/prong' && github.event_name != 'pull_request'
    name: Publication
    strategy:
      fail-fast: true
      matrix:
        configuration: [Debug, Release]
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }} --no-restore

    - name: Pack
      run: dotnet pack ./Software9119.Async.Superb/Software9119.Async.Superb.csproj --no-restore --no-build --configuration ${{ matrix.configuration }} --output ${{ github.workspace }}/nupkgs

    - name: Upload to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nupkgs-${{ matrix.configuration }}
        path: ${{ github.workspace }}/nupkgs/*.*nupkg
        retention-days: 2

    - name: NuGet login (Trusted Publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: that-deepfelt

    - name: Push
      shell: pwsh
      run: |
        $dir = "${{ github.workspace }}/nupkgs"
        $files = Get-ChildItem -Path $dir -File | Where-Object { $_.Extension -in '.nupkg' }
        if ($files.Count -eq 0) { Write-Error "No packages found in $dir"; exit 1 }
        foreach ($f in $files) {
          Write-Host "Pushing $($f.Name)"
          dotnet nuget push $f.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate }